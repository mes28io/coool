[workspace]
resolver = "3"
members = ["crates/core", "crates/tui", "crates/whisper", "app/src-tauri"]

[profile.release]
lto = "thin"
strip = true

# Transcript parsing is the hot path; keep it fast in `tauri dev` / debug builds too.
[profile.dev.package.coool-core]
opt-level = 2

[profile.dev.package.serde_json]
opt-level = 2

[profile.dev.package.serde]
opt-level = 2
