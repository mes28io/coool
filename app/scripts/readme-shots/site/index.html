<!doctype html>
<!-- An invented local page for the launch film's Browser panel shot (film.sh serves this folder): the dev console of
     the invented atlas-api project. Nothing here is real; no network. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>atlas-api · API keys</title>
<style>
  :root { --bg: #f6f5f1; --card: #fff; --ink: #1b1b1f; --dim: #6b6b73; --line: #e6e3dc; --blue: #2f8cff; --green: #3dbe5b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  header { display: flex; align-items: center; gap: 10px; padding: 18px 28px; border-bottom: 1px solid var(--line); background: #fbfaf7; }
  .logo { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #2f8cff, #7c5cff); }
  header b { font-weight: 650; }
  header span { color: var(--dim); }
  header .env { margin-left: auto; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: #fff3d6; color: #8a5a00; }
  main { max-width: 760px; margin: 0 auto; padding: 30px 28px; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 22px; color: var(--dim); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 14px; }
  th { border-top: 0; color: var(--dim); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  code { font: 13px ui-monospace, "SF Mono", Menlo, monospace; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: #eef5ff; color: #1f6fd6; }
  .row-new { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: #e9fbe9; } to { background: transparent; } }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  button { font: inherit; font-weight: 550; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer; }
  .primary { background: var(--ink); color: #fff; }
  .ghost { background: transparent; color: var(--dim); }
  form { display: none; padding: 18px 16px; gap: 14px; border-bottom: 1px solid var(--line); background: #fcfbf8; }
  form.open { display: grid; grid-template-columns: 1fr 1fr auto; align-items: end; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--dim); }
  input, select { font: inherit; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
  .note { display: none; margin-top: 16px; padding: 12px 16px; border-radius: 12px; background: #eafaee; color: #1d6b31; border: 1px solid #c9efd3; }
  .note.show { display: block; }
</style>
</head>
<body>
<header><div class="logo"></div><b>atlas-api</b><span>console</span><span class="env">local dev</span></header>
<main>
  <div class="bar">
    <div><h1>API keys</h1><p class="sub">Each key has its own rate limit budget on /v2.</p></div>
    <button class="primary" id="new" type="button">Create key</button>
  </div>
  <div class="card">
    <form id="f">
      <label>Key name <input id="name" name="name" placeholder="e.g. mobile-app" autocomplete="off"></label>
      <label>Budget
        <select id="budget" name="budget"><option>30 / min</option><option>60 / min</option><option>120 / min</option></select>
      </label>
      <div><button class="ghost" type="button" id="cancel">Cancel</button> <button class="primary" type="submit">Create</button></div>
    </form>
    <table>
      <thead><tr><th>Name</th><th>Key</th><th>Budget</th><th>Last used</th></tr></thead>
      <tbody id="rows">
        <tr><td>web-dashboard</td><td><code>atl_dev_4f9c…e21a</code></td><td><span class="pill">120 / min</span></td><td>2 min ago</td></tr>
        <tr><td>mobile-app</td><td><code>atl_dev_b07d…91c3</code></td><td><span class="pill">60 / min</span></td><td>1 h ago</td></tr>
        <tr><td>nightly-export</td><td><code>atl_dev_7a12…0d5e</code></td><td><span class="pill">30 / min</span></td><td>yesterday</td></tr>
      </tbody>
    </table>
  </div>
  <div class="note" id="note"></div>
</main>
<script>
  const f = document.getElementById("f");
  document.getElementById("new").onclick = () => { f.classList.add("open"); document.getElementById("name").focus(); };
  document.getElementById("cancel").onclick = () => f.classList.remove("open");
  f.onsubmit = (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim() || "unnamed";
    const budget = document.getElementById("budget").value;
    const tr = document.createElement("tr");
    tr.className = "row-new";
    tr.innerHTML = `<td>${name.replace(/</g, "&lt;")}</td><td><code>atl_dev_c3e8…5b07</code></td><td><span class="pill">${budget}</span></td><td>never</td>`;
    document.getElementById("rows").prepend(tr);
    f.classList.remove("open");
    const n = document.getElementById("note");
    n.textContent = `Key "${name}" created with a budget of ${budget}.`;
    n.classList.add("show");
  };
</script>
</body>
</html>
