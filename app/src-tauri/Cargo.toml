[package]
name = "coool-app"
version = "0.1.0"
edition = "2024"
description = "coool desktop app: a workspace for running many coding agents across many projects"
license = "MIT"
homepage = "https://coool.sh"
# The desktop app's executable is `coool`, so macOS shows "coool" in the Dock in dev builds too.
default-run = "coool"

[[bin]]
name = "coool"
path = "src/main.rs"

[lib]
name = "coool_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
coool-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
libc = "0.2"
anyhow = "1"
dirs = "7"

# Reduce-motion hints (motion.rs): Low Power Mode, thermal state. Both crates are already in Tauri's tree.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSArray", "NSDictionary", "NSString", "NSValue"] }
