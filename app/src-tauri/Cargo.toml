[package]
name = "coool-app"
version = "0.4.5"
edition = "2024"
description = "coool desktop app: a workspace for running many coding agents across many projects"
license = "MIT"
homepage = "https://coool.sh"
# The desktop app's executable is `coool`, so macOS shows "coool" in the Dock in dev builds too.
default-run = "coool"

[[bin]]
name = "coool"
path = "src/main.rs"

[lib]
name = "coool_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dev-dependencies]
# Signs test releases in the updater's tests and examples/sign_release.rs (never part of the app).
minisign = "0.7"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
coool-core = { path = "../../crates/core" }
# coool Remote (src/remote.rs, docs/REMOTE.md).
coool-remote = { path = "../../crates/remote" }
# `unstable`: child webviews (`Window::add_child`) for the in-app browser (src/browser.rs). `webview-data-url`: the
# artifact preview window loads its host page as a `data:` URL (src/artifact.rs).
tauri = { version = "2", features = ["unstable", "webview-data-url"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
base64 = "0.22"
libc = "0.2"
anyhow = "1"
dirs = "7"
tauri-plugin-opener = "2"
# The device pilot's Haiku decider (src/device/pilot/haiku.rs); already in the tree through coool-core.
ureq = "3"
# Settings > Connections reads ~/.codex/config.toml (read only). Already in the tree through tauri-build.
toml = "1"
# Voice (src/voice): local whisper.cpp (vendored in crates/whisper, built without CMake) and the model checksum.
coool-whisper = { path = "../../crates/whisper" }
# The lid helper's install script checks the staged files' SHA-256 (src/lid/helper.rs). Already in the tree through Tauri.
sha2 = "0.10"
# In-app updates (src/update/): a release's minisign signature, checked against the public keys pinned in the app.
minisign-verify = "0.2"
# The commands' runtime with room to spare (lib.rs `command_runtime`). Already in the tree through Tauri.
tokio = { version = "1", features = ["rt-multi-thread"] }

# Reduce-motion hints (motion.rs): Low Power Mode, thermal state. Both crates are already in Tauri's tree.
# `NSGeometry`: the self-test's native clicks (selftest.rs).
[target.'cfg(target_os = "macos")'.dependencies]
# Voice: the microphone (Core Audio through cpal; Apache-2.0, objc2-based, no bindgen).
cpal = "0.18"
objc2 = "0.6"
# Completion handlers of WKWebView (the agent's browser tools: evaluateJavaScript, takeSnapshot). Already in Tauri's tree.
block2 = "0.6"
# The menu bar item (src/menubar/ui.rs): NSStatusItem, its NSMenu and their attributed titles. Already in Tauri's tree.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSMenu", "NSMenuItem", "NSFont", "NSFontDescriptor", "NSColor", "NSAttributedString", "NSParagraphStyle", "NSText", "NSImage", "NSBezierPath", "NSGraphics", "NSStringDrawing", "NSCell", "NSButtonCell", "NSAppearance", "NSTextField", "NSWindow", "NSScreen", "NSBitmapImageRep", "NSImageRep", "NSColorSpace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSArray", "NSDictionary", "NSString", "NSValue", "NSGeometry", "NSBundle", "NSError", "NSObject", "NSRange", "NSAttributedString", "NSData", "NSFileManager", "NSURL"] }
# Settings > Notifications (notify.rs): the system's notification center and its permission flow. Already in Tauri's tree.
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationSettings", "UNNotificationTrigger", "UNNotification", "UNNotificationResponse"] }
