[package]
name = "coool-core"
version = "0.5.1"
edition = "2024"
description = "Core of coool: discover, monitor and drive Claude Code and Codex sessions"
license = "MIT"
homepage = "https://coool.sh"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "7"
libc = "0.2"
memchr = "2"
regex = "1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ureq = "3"
unicode-width = "0.2"
vt100 = "0.16.2"
notify = "8"
