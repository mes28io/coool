[package]
name = "coool-remote"
version = "0.1.0"
edition = "2024"
description = "coool Remote, the Mac side: pairing, end-to-end encrypted messages through the relay, and the rules remote commands follow (docs/REMOTE.md)"
license = "MIT"
homepage = "https://coool.sh"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Cryptography: the dalek and RustCrypto crates (no primitive is written here).
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
# The relay (Convex): its official Rust client, for mutations and live queries over one WebSocket. `native-tls` on
# macOS is Security.framework (no vendored OpenSSL).
convex = { version = "0.10.4", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
futures = "0.3"
