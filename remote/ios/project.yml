# coool Remote for iPhone. The checked-in CooolRemote.xcodeproj is generated from this file:
#   cd remote/ios && xcodegen
name: CooolRemote
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  RemoteProtocol:
    path: RemoteProtocol
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    exactVersion: 0.8.2
targets:
  CooolRemote:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: RemoteProtocol
      - package: ConvexMobile
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: coool Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: coool Remote uses the camera to scan the pairing code your Mac shows, and to take a photo you send to a chat.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: sh.coool.remote.pair
            CFBundleURLSchemes: [coool]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.coool.remote
        PRODUCT_NAME: CooolRemote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  CooolRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: CooolRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.coool.remote.uitests
        TEST_TARGET_NAME: CooolRemote
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CooolRemote:
    build:
      targets:
        CooolRemote: all
    test:
      targets:
        - CooolRemoteUITests
        - package: RemoteProtocol/RemoteProtocolTests
